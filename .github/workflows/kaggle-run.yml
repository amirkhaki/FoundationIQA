name: kaggle-run

# General-purpose, ad-hoc runs. For the fast Tier-1/Tier-2 split, use kaggle-tier1.yml
# / kaggle-tier2.yml instead - they push to their own, separate kernels so a Tier-2
# iteration never fights an ad-hoc run (or a Tier-1 run) for the same kernel slot.
#
# Manual trigger on purpose: runs are long and Kaggle GPU quota is limited.
# Pick any branch in the "Run workflow" dialog; the commit that gets executed on
# Kaggle is that branch's head, and it is recorded in run_meta.json + the artifact name.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Shell command to run on Kaggle (cwd=/kaggle/working, repo already cloned + pip installed). Anything left in /kaggle/working becomes the artifact."
        required: true
        default: "python -m foundation_hybrid.run_ablations --no-regression --datasets TID2013 --out-dir /tmp/raw"

# One run of THIS workflow at a time. Runs a separate kernel from kaggle-tier1.yml /
# kaggle-tier2.yml, so it does not queue behind (or block) those.
concurrency:
  group: kaggle-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # GitHub-hosted jobs are capped at 6 h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ./.github/actions/kaggle-run
        with:
          # Your Kaggle username (the "me" in me/slug). Not part of the new API token, so it
          # comes from a repository VARIABLE named KAGGLE_USERNAME (a secret of that name also works).
          kaggle_owner: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
          kaggle_token: ${{ secrets.KAGGLE_API_TOKEN }}
          slug: foundationiqa-runner   # must equal the kernel title, Kaggle derives the slug from it
          command: ${{ inputs.command }}
          # Things to attach to the kernel, as JSON lists of "owner/slug". Set as repository
          # VARIABLES (Settings -> Secrets and variables -> Actions -> Variables):
          #   KAGGLE_KERNEL_SOURCES  : notebooks whose OUTPUT you want as input, e.g. the one made by
          #                            ci/kaggle_prepare_datasets.py -> ["you/iqa-datasets"]
          #   KAGGLE_DATASET_SOURCES : ordinary Kaggle Datasets
          dataset_sources: ${{ vars.KAGGLE_DATASET_SOURCES || '[]' }}
          kernel_sources: ${{ vars.KAGGLE_KERNEL_SOURCES || '[]' }}
          artifact_name: kaggle-results-${{ github.sha }}-${{ github.run_id }}
